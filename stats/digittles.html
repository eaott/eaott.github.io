<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digittles Sample</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --ink: #1f2937;
        --muted: #5b6474;
        --brand: #1a4d8f;
        --brand-2: #5fa8ff;
        --border: #dfe6ee;
        --shadow: 0 12px 30px rgba(17, 24, 39, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 100%);
        color: var(--ink);
      }

      .topbar {
        display: flex;
        justify-content: center;
        padding: 1rem 1.25rem 0;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
        text-decoration: none;
        color: var(--ink);
        background: rgba(255,255,255,0.7);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0.6rem 1rem;
        box-shadow: var(--shadow);
      }

      .brand-logo {
        width: 5.1rem;
        height: auto;
        display: block;
        border-radius: 0.5rem;
      }

      .brand-name {
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 2rem 1.25rem 3rem;
      }

      .header-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1.25rem;
        flex-wrap: wrap;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 4vw, 2.6rem);
      }

      .action {
        appearance: none;
        border: none;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
        color: white;
        font-size: 1rem;
        font-weight: 700;
        padding: 0.9rem 1.3rem;
        cursor: pointer;
        box-shadow: 0 8px 18px rgba(26, 77, 143, 0.25);
      }

      .action:hover { filter: brightness(1.04); }
      .action:focus-visible { outline: 3px solid #f4b942; outline-offset: 3px; }

      .sample-layout {
        display: grid;
        grid-template-columns: minmax(0, 1.65fr) minmax(260px, 0.9fr);
        gap: 1.2rem;
        align-items: stretch;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: var(--shadow);
      }

      .pile-card {
        padding: 1.25rem;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-width: 0;
      }

      .section-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.75rem;
        margin-bottom: 0.75rem;
      }

      h2 {
        margin: 0;
        font-size: 1.15rem;
      }

      .piece-total {
        color: var(--muted);
        font-size: 0.9rem;
        white-space: nowrap;
      }

      .pile-stage {
        min-height: 300px;
        display: grid;
        place-items: center;
        overflow: hidden;
        border: 1px solid #e5e9ef;
        border-radius: 14px;
        background:
          radial-gradient(ellipse at 50% 80%, rgba(114, 86, 53, 0.1), transparent 60%),
          repeating-linear-gradient(0deg, transparent, transparent 25px, rgba(67, 86, 105, 0.035) 26px),
          #f8fafc;
      }

      .candy-pile {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.28rem;
        padding: 1rem 0.35rem;
        width: 100%;
      }

      .candy-row {
        display: flex;
        justify-content: center;
        gap: 0.3rem;
      }

      .candy {
        --candy: #ed2636;
        position: relative;
        display: block;
        width: clamp(48px, 9vw, 76px);
        height: clamp(30px, 5.4vw, 43px);
        flex: 0 0 auto;
        border: 1px solid rgba(70, 38, 25, 0.25);
        border-radius: 55% 48% 52% 46% / 52% 55% 45% 48%;
        background: linear-gradient(155deg, rgba(255,255,255,0.48), transparent 34%),
          linear-gradient(180deg, color-mix(in srgb, var(--candy), white 12%), var(--candy) 58%, color-mix(in srgb, var(--candy), black 12%));
        box-shadow: 0 4px 5px rgba(29, 34, 39, 0.2), inset 0 -2px 3px rgba(0, 0, 0, 0.12);
      }

      .candy::after {
        content: "";
        position: absolute;
        left: 20%;
        top: 16%;
        width: 34%;
        height: 18%;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.5);
        transform: rotate(-13deg);
      }

      .pile-caption {
        margin: 0.85rem 0 0;
        color: var(--muted);
        font-size: 0.9rem;
        text-align: center;
      }

      .summary-card { padding: 1.25rem; }

      .summary-card h2 { margin-bottom: 0.35rem; }

      .summary-note {
        margin: 0 0 1rem;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .color-list {
        display: grid;
        gap: 0.2rem;
      }

      .color-header,
      .color-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 3.2rem 4.2rem;
        align-items: center;
        gap: 0.5rem;
        font-variant-numeric: tabular-nums;
      }

      .color-header {
        padding: 0.4rem 0;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 700;
      }

      .color-row {
        min-height: 46px;
        border-top: 1px solid #edf0f4;
      }

      .color-name {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        font-weight: 600;
      }

      .swatch {
        width: 1rem;
        height: 1rem;
        flex: 0 0 auto;
        border: 1px solid rgba(0, 0, 0, 0.18);
        border-radius: 50%;
        background: var(--candy);
      }

      .count, .proportion { text-align: right; }
      .count { font-weight: 700; }
      .proportion { color: var(--muted); }

      .summary-footer {
        display: flex;
        justify-content: space-between;
        gap: 0.5rem;
        margin-top: 0.8rem;
        padding-top: 0.85rem;
        border-top: 1px solid var(--border);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      .plot-card {
        margin-top: 1.2rem;
        padding: 1.25rem;
      }

      .plot-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin-bottom: 0.25rem;
      }

      .plot-controls {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
      }

      .plot-controls label {
        color: var(--muted);
        font-size: 0.9rem;
      }

      .plot-select {
        min-width: 7.5rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: white;
        color: var(--ink);
        font: inherit;
        padding: 0.45rem 0.6rem;
      }

      .plot-select:focus-visible { outline: 3px solid #f4b942; outline-offset: 2px; }

      .plot-count, .plot-note {
        color: var(--muted);
        font-size: 0.88rem;
      }

      .plot-note { margin: 0 0 0.5rem; }

      .dotplot {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
      }

      .plot-grid { stroke: #dfe6ee; stroke-width: 1; }
      .plot-axis { stroke: #8793a2; stroke-width: 1.4; }
      .plot-label { fill: #5b6474; font: 12px Arial, Helvetica, sans-serif; }
      .plot-color-label { fill: #1f2937; font: 600 13px Arial, Helvetica, sans-serif; }
      .plot-dot { stroke: rgba(31, 41, 55, 0.5); stroke-width: 1; }
      .plot-overflow { stroke: #fff; stroke-width: 1; }

      @media (max-width: 760px) {
        .sample-layout { grid-template-columns: 1fr; }
        .pile-stage { min-height: 260px; }
        .candy { width: clamp(48px, 12vw, 72px); height: clamp(30px, 7vw, 41px); }
      }

      @media (max-width: 600px) {
        .header-row { align-items: flex-start; flex-direction: column; }
        .action { width: 100%; }
        .container { padding-top: 1.5rem; }
        .pile-card, .summary-card, .plot-card { padding: 1rem; }
        .plot-label { font-size: 11px; }
        .plot-color-label { font-size: 12px; }
        .pile-stage { min-height: 235px; }
        .candy-pile { gap: 0.2rem; }
        .candy-row { gap: 0.18rem; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="Return to the homepage">
        <img class="brand-logo" src="/assets/images/test-227x151.png" alt="Homepage logo" />
        <span class="brand-name">Homepage</span>
      </a>
    </header>

    <main class="container">
      <div class="header-row">
        <h1>Digittles Sample</h1>
        <button id="regenBtn" class="action" type="button">Generate new set</button>
      </div>

      <div class="sample-layout" aria-live="polite">
        <section class="card pile-card" aria-labelledby="pileHeading">
          <div class="section-heading">
            <h2 id="pileHeading">Your packet</h2>
            <span class="piece-total">15 Digittles</span>
          </div>
          <div class="pile-stage">
            <div id="candyPile" class="candy-pile" aria-hidden="true"></div>
          </div>
          <p class="pile-caption">Your packet of "Digittles."</p>
        </section>

        <section class="card summary-card" aria-labelledby="summaryHeading">
          <h2 id="summaryHeading">Color breakdown</h2>
          <p class="summary-note">(Each color has a 0.200 chance per Digittle.)</p>
          <div id="colorList" class="color-list"></div>
          <div class="summary-footer">
            <span>Total sample</span>
            <span>15 · 1.000</span>
          </div>
        </section>
      </div>

      <section class="card plot-card" aria-labelledby="plotHeading">
        <div class="plot-heading">
          <h2 id="plotHeading">Dotplot</h2>
          <div class="plot-controls">
            <label for="plotColor">Color</label>
            <select id="plotColor" class="plot-select">
              <option value="Red" selected>Red</option>
              <option value="Yellow">Yellow</option>
              <option value="Green">Green</option>
              <option value="Purple">Purple</option>
              <option value="Orange">Orange</option>
            </select>
          </div>
        </div>
        <p class="plot-note">One dot per packet; repeated proportions stack. Values above 0.600 are marked at the right edge.</p>
        <span id="plotCount" class="plot-count">0 packets</span>
        <svg id="dotplot" class="dotplot" viewBox="0 0 960 400" role="img" aria-labelledby="plotTitle plotDescription">
          <title id="plotTitle">Red proportion dotplot</title>
          <desc id="plotDescription">One dot for each packet's Red proportion. The horizontal axis runs from 0 to 0.600.</desc>
          <g id="plotContent"></g>
        </svg>
      </section>
    </main>

    <script>
      const colors = [
        { name: 'Red', value: '#ed2636' },
        { name: 'Yellow', value: '#f4c928' },
        { name: 'Green', value: '#28a957' },
        { name: 'Purple', value: '#773f9b' },
        { name: 'Orange', value: '#f18424' }
      ];
      const packetSize = 15;
      const rowSizes = [3, 4, 5, 3];
      const sampleHistory = [];

      function drawPacket() {
        return Array.from({ length: packetSize }, () =>
          colors[Math.floor(Math.random() * colors.length)]
        );
      }

      function renderSample() {
        const sample = drawPacket();
        const counts = Object.fromEntries(colors.map(({ name }) => [name, 0]));
        const pile = document.getElementById('candyPile');
        const colorList = document.getElementById('colorList');
        let offset = 0;

        sample.forEach(({ name }) => { counts[name] += 1; });
        pile.innerHTML = rowSizes.map((rowSize) => {
          const candies = sample.slice(offset, offset + rowSize).map(({ name, value }) => {
            const rotation = Math.floor(Math.random() * 31) - 15;
            return `<span class="candy" style="--candy: ${value}; transform: rotate(${rotation}deg)" title="${name}"></span>`;
          }).join('');
          offset += rowSize;
          return `<div class="candy-row">${candies}</div>`;
        }).join('');

        sampleHistory.push(Object.fromEntries(colors.map(({ name }) => [name, counts[name]])));
        colorList.innerHTML = `
          <div class="color-header" aria-hidden="true">
            <span>Color</span><span class="count">Count</span><span class="proportion">Proportion</span>
          </div>
        ` + colors.map(({ name, value }) => {
          const proportion = (counts[name] / packetSize).toFixed(3);
          return `
            <div class="color-row">
              <span class="color-name"><span class="swatch" style="--candy: ${value}" aria-hidden="true"></span>${name}</span>
              <span class="count">${counts[name]}</span>
              <span class="proportion">${proportion}</span>
            </div>
          `;
        }).join('');

        renderDotplot();
      }

      function renderDotplot() {
        const plotContent = document.getElementById('plotContent');
        const plotCount = document.getElementById('plotCount');
        const plotTitle = document.getElementById('plotTitle');
        const plotDescription = document.getElementById('plotDescription');
        const plot = document.getElementById('dotplot');
        const selectedName = document.getElementById('plotColor').value;
        const selectedColor = colors.find(({ name }) => name === selectedName) || colors[0];
        const plotLeft = 105;
        const plotRight = 920;
        const plotWidth = plotRight - plotLeft;
        const axisMaximum = 0.6;
        const frequencies = {};
        sampleHistory.forEach((sample) => {
          frequencies[sample[selectedColor.name]] = (frequencies[sample[selectedColor.name]] || 0) + 1;
        });
        const laneHeight = Math.max(98, Math.max(...Object.values(frequencies)) * 10 + 26);
        const plotHeight = 18 + laneHeight + 44;
        const axisY = plotHeight - 28;
        const laneTop = 18;
        const marks = [];

        plot.setAttribute('viewBox', `0 0 960 ${plotHeight}`);
        plotCount.textContent = `${sampleHistory.length} ${sampleHistory.length === 1 ? 'packet' : 'packets'}`;
        plotTitle.textContent = `${selectedColor.name} proportion dotplot, ${sampleHistory.length} ${sampleHistory.length === 1 ? 'packet' : 'packets'}`;
        plotDescription.textContent = `Each dot shows one packet's ${selectedColor.name} proportion. Matching values stack vertically. The horizontal axis runs from 0.000 to 0.600.`;

        for (let tick = 0; tick <= 6; tick += 1) {
          const value = tick / 10;
          const x = plotLeft + value / axisMaximum * plotWidth;
          marks.push(`<line class="plot-grid" x1="${x}" y1="18" x2="${x}" y2="${axisY}" />`);
          marks.push(`<text class="plot-label" x="${x}" y="${axisY + 19}" text-anchor="middle">${value.toFixed(3)}</text>`);
        }
        marks.push(`<line class="plot-axis" x1="${plotLeft}" y1="${axisY}" x2="${plotRight}" y2="${axisY}" />`);

        const baseline = laneTop + laneHeight - 12;
        const seen = {};
        marks.push(`<line class="plot-grid" x1="${plotLeft}" y1="${baseline}" x2="${plotRight}" y2="${baseline}" />`);
        marks.push(`<text class="plot-color-label" x="0" y="${baseline + 4}">${selectedColor.name}</text>`);

        sampleHistory.forEach((sample, sampleIndex) => {
          const count = sample[selectedColor.name];
          const stackIndex = seen[count] || 0;
          seen[count] = stackIndex + 1;
          const proportion = count / packetSize;
          const y = baseline - 5 - stackIndex * 10;
          const title = `${selectedColor.name}: ${proportion.toFixed(3)} in packet ${sampleIndex + 1}`;

          if (proportion > axisMaximum) {
            marks.push(`<path class="plot-overflow" fill="${selectedColor.value}" d="M ${plotRight - 2} ${y} l -9 -5 v 10 z"><title>${title}, above 0.600</title></path>`);
          } else {
            const x = plotLeft + proportion / axisMaximum * plotWidth;
            marks.push(`<circle class="plot-dot" cx="${x}" cy="${y}" r="5" fill="${selectedColor.value}"><title>${title}</title></circle>`);
          }
        });

        plotContent.innerHTML = marks.join('');
      }

      document.getElementById('regenBtn').addEventListener('click', renderSample);
      document.getElementById('plotColor').addEventListener('change', renderDotplot);
      renderSample();
    </script>
  </body>
</html>
